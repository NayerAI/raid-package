[project]
name = "raid"
version = "0.2.0"
description = "Client for the RAID competition system"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
task-fetch = "raid.cli:fetch"
task-check = "raid.cli:check"
task-submit = "raid.cli:submit"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"
